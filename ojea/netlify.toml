# Otealo (MexicoV5) — Netlify production is a static SPA.
# The Nitro serverless handler 500s on Netlify (`HTTPError`); Otealo does not
# need SSR (client Supabase + zustand). Build writes HTML into dist/ and
# drops the function. Live preview still uses `npm run dev`.

[build]
  command = "NETLIFY_SPA_DROP_FUNCTIONS=1 npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

[[redirects]]
  from = "/c/*"
  to = "/.netlify/functions/clip-card"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
