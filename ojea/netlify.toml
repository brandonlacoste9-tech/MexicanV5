# Used when the Netlify base directory is ojea/.
# Repo-root netlify.toml is the one ojea-mexico actually reads.

[build]
  command = "NETLIFY_SPA_DROP_FUNCTIONS=1 npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
