# Otealo (MexicoV5) — Netlify production is a static SPA.
# The Nitro serverless handler 500s on Netlify (`HTTPError`); Otealo does not
# need SSR (client Supabase + zustand). Build writes HTML into dist/ and
# drops the function. Live preview still uses `npm run dev`.

[build]
  command = "NETLIFY_SPA_DROP_FUNCTIONS=1 npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/feed"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/api/feed/*"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/api/clips"
  to = "/.netlify/functions/feed"
  status = 200

[[redirects]]
  from = "/c/*"
  to = "/.netlify/functions/clip-card"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://grok.com https://*.grok.com; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co https://lh3.googleusercontent.com https://*.tiktokcdn.com https://*.tiktokcdn-us.com https://*.tiktok.com; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com; frame-src https://accounts.google.com; form-action 'self' https://accounts.google.com https://*.supabase.co"

[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
