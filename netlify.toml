# Ojea Mexico — static web in ojea/. API is ojea-api on Render.
# Nitro's Netlify function 500s every HTML route; Ojea is client-only
# (Supabase + zustand), so the build writes HTML and drops the function.

[build]
  command = "npm run build:ojea"
  publish = "ojea/dist"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"
  NODE_OPTIONS = "--max-old-space-size=4096"
  CI = "true"
  NETLIFY_SPA_DROP_FUNCTIONS = "1"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/c/*"
  to = "/.netlify/functions/clip-card"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
