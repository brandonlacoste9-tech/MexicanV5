# Ojea Mexico — TikTok-style web lives in ojea/.
# API is ojea-api on Render, not the old Québec Railway box.

[build]
  command = "npm run build:ojea"
  publish = "ojea/dist"

[build.environment]
  NODE_VERSION = "20"
  NITRO_PRESET = "netlify"
  NODE_OPTIONS = "--max-old-space-size=4096"
  CI = "true"

[functions]
  directory = "ojea/.netlify/functions-internal"

[[headers]]
  for = "/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
