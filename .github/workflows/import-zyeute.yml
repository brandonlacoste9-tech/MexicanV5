name: Import OjeaV5 frontend and backend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sparse-clone OjeaV5
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/brandonlacoste9-tech/OjeaV5.git /tmp/ojea
          cd /tmp/ojea
          git sparse-checkout set frontend backend
      - name: Copy trees
        run: |
          rm -rf frontend backend
          mkdir -p frontend backend
          cp -a /tmp/ojea/frontend/. frontend/
          cp -a /tmp/ojea/backend/. backend/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Copy frontend/ and backend/ from OjeaV5"
          git push
