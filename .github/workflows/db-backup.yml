name: 🛡️ Database Backup

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  backup:
    name: Create & Archive Backup
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # matches "engines": node >= 22 in package.json
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🐘 Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version

      - name: 🗄️ Run Backup Script
        env:
          # Must exist in GitHub repo Settings -> Secrets and variables -> Actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_DIR: ./backups
        run: |
          mkdir -p ./backups
          npm run db:backup

      - name: ☁️ Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ojea-db-backup-${{ github.run_id }}
          path: ./backups/*.sql.gz
          retention-days: 7
          if-no-files-found: error
