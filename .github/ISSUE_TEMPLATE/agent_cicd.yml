        8. **Error handling components** - Error displays
        
        ---
        
        ## 🛠️ TESTING TOOLS ALREADY IN PROJECT
        
        **Check `package.json` for:**
        - ✅ **Vitest** - Unit test runner (already configured)
        - ✅ **@testing-library/react** - React component testing
        - ✅ **@testing-library/user-event** - User interaction simulation
        - ⚠️ **c8 or istanbul** - Coverage tool (verify installed)
        
        **Run Commands:**
        ```bash
        npm test              # Run all tests
        npm test -- --watch   # Watch mode
        npm test -- --coverage # With coverage
        npm run lint          # Run linter
        npm run type-check    # TypeScript check
        ```
        
        ---
        
        ## 💡 TESTING BEST PRACTICES
        
        ### Mock External Dependencies:
        ```typescript
        // Mock Supabase client
        vi.mock('../lib/supabase', () => ({
          supabase: {
            auth: {
              signInWithPassword: vi.fn(),
              signOut: vi.fn()
            }
          }
        }));
        ```
        
        ### Test User Interactions:
        ```typescript
        import { render, screen } from '@testing-library/react';
        import userEvent from '@testing-library/user-event';
        
        it('should submit form on button click', async () => {
          const user = userEvent.setup();
          render(<Login />);
          
          await user.type(screen.getByLabelText('Email'), 'test@example.com');
          await user.click(screen.getByRole('button', { name: /login/i }));
          
          expect(mockSignIn).toHaveBeenCalledWith('test@example.com', expect.any(String));
        });
        ```
        
        ### Test Edge Cases:
        ```typescript
        it('should handle expired guest session', () => {
          // Setup expired timestamp
          localStorage.setItem('ojea_guest_timestamp', String(Date.now() - 25 * 60 * 60 * 1000));
          
          const { result } = renderHook(() => useGuestMode());
          
          expect(result.current.isExpired).toBe(true);
          expect(localStorage.getItem('ojea_guest_mode')).toBeNull();
        });
        ```
        
